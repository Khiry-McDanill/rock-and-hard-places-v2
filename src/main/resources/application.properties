spring.datasource.url=jdbc:sqlite:./rhp.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Server-side planning only; an absent key does not prevent startup.
rhp.planning.gemini.api-key=${GEMINI_API_KEY:}
rhp.planning.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
rhp.planning.gemini.timeout-ms=30000
